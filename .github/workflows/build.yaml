#
#  build — every push and pull request runs the same `clog build` a laptop runs.
#
#  There is nothing repo-specific here on purpose. The callable workflow asks
#  .clog.yaml what this repo is (ci.stack: golang), installs that stack's
#  toolchain and runs the verb. Changing what CI does means editing .clog.yaml,
#  not this file — which is the only way CI and a laptop cannot drift.
#
#  Tags are handled by release.yaml, which builds AND publishes.
#
#  This repo is being retired in favour of mrmxf/clog, which now carries both
#  the CLI and these workflows. It builds against that repo's build-check.yaml
#  so the last thing it does is prove the new one works for a caller that is
#  not itself.

name: build
run-name: build(${{ github.event_name }}) 🥷${{ github.actor }}

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]     # a release tag belongs to release.yaml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: mrmxf/clog/.github/workflows/build-check.yaml@main
    permissions:
      contents: read
      id-token: write         # OIDC → Infisical, when ci.infisical is configured
      security-events: write  # the scan phase's SARIF
    with:
      self-build: true        # this repo IS clog: build it from its own go.mod
