# clog-sample project configuration
# This file demonstrates how to wire snippets and check blocks into a clog-style app.

# ─── snippets ────────────────────────────────────────────────────────────────
# Each key becomes a subcommand: `clog-sample hello`, `clog-sample go-ver` etc.
snippets:
  hello:
    help: "Print a hello message"
    script: echo "Hello from clog-sample!"

  go-ver:
    help: "Show the installed Go version"
    script: go version

  git-status:
    help: "Show git working-tree status"
    script: git status --short

  tools-check:
    help: "Run the 'tools' check group (same as: clog-sample Check tools)"
    script: go run . Check tools

# ─── check ───────────────────────────────────────────────────────────────────
# Run with: clog-sample Check tools
#
# Each block ANDs its env: + try: conditions. The value beside each condition is
# the state it must satisfy:
#   truthy        env var set & non-empty   /  try cmd exits 0
#   falsy         env var unset/empty       /  try cmd exits non-zero
#   "literal"     exact match (env value or trimmed stdout)
#   "~regexp"     Go regexp match
#   ">N" / "<N"   numeric comparison
# then: runs when ALL conditions are truthy; else: when ANY is falsy (ok:/catch:
# are accepted aliases). finally: always runs and can read the $CHECK_* vars.
check:
  tools:
    name: "sample tool checks"
    blocks:
      - name: golang installed
        try:
          - "go version >/dev/null 2>&1": truthy
        then: echo "  golang ok"
        else: |
          echo "  golang missing — install from https://go.dev"
          exit 1

      - name: git installed
        try:
          - "git --version >/dev/null 2>&1": truthy
        then: echo "  git ok"
        else: |
          echo "  git missing — install git for your OS"
          exit 1

      - name: go.mod present
        try:
          - "[ -f go.mod ]": truthy
        then: echo "  go.mod found"
        else: echo "  go.mod not found (run from project root)"

      # env: conditions are pure-Go (no shell). This block only warns in CI.
      - name: not running in CI
        env:
          - CI: falsy
        then: echo "  local shell (not CI)"
        else: echo "  running under CI"
        finally: echo "  [$CHECK_NAME] truthy=$CHECK_TRUTHY_CONDITIONS falsy=$CHECK_FALSY_CONDITIONS"
